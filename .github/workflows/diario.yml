name: Monitor diário município x União

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Garante que só um run roda por vez — evita conflitos de push
concurrency:
  group: monitor-diario
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar monitor
        env:
          DATAJUD_API_KEY: ${{ secrets.DATAJUD_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py

      - name: Commitar estado de deduplicação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/reported.json || true
          if git diff --cached --quiet; then
            echo "Sem mudanças no estado — nada a commitar."
            exit 0
          fi
          git commit -m "Atualiza state/reported.json [skip ci]"
          # Push com retry: se rejeitado, faz rebase e tenta de novo (até 3x)
          for i in 1 2 3; do
            if git push; then
              echo "Push OK na tentativa $i."
              exit 0
            fi
            echo "Push rejeitado (tentativa $i). Sincronizando..."
            git pull --rebase origin main
          done
          echo "Push falhou após 3 tentativas."
          exit 1
